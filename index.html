      function ProjectsSection({ onOpenJsSandbox }) {
        const [trimesterFilter, setTrimesterFilter] = useState('all');
        const [categoryFilter, setCategoryFilter] = useState('all');
        const [searchQuery, setSearchQuery] = useState('');
        const [copiedId, setCopiedId] = useState(null);

        const filteredProjects = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          return PROJECTS.filter((item) => {
            if (trimesterFilter !== 'all' && item.trimester !== trimesterFilter) {
              return false;
            }
            if (categoryFilter !== 'all' && item.category !== categoryFilter) {
              return false;
            }
            if (q) {
              const hay = `${item.title} ${item.description} ${item.category} ${item.authors} ${item.url}`.toLowerCase();
              return hay.includes(q);
            }
            return true;
          });
        }, [trimesterFilter, categoryFilter, searchQuery]);

        const trimesterCounts = useMemo(
          () => ({
            all: PROJECTS.length,
            1: PROJECTS.filter((p) => p.trimester === 1).length,
            2: PROJECTS.filter((p) => p.trimester === 2).length,
            3: PROJECTS.filter((p) => p.trimester === 3).length,
          }),
          [],
        );

        const categoryCounts = useMemo(() => {
          const base =
            trimesterFilter === 'all'
              ? PROJECTS
              : PROJECTS.filter((p) => p.trimester === trimesterFilter);
          return {
            all: base.length,
            HTML: base.filter((p) => p.category === 'HTML').length,
            JavaScript: base.filter((p) => p.category === 'JavaScript').length,
            'Google AI': base.filter((p) => p.category === 'Google AI').length,
          };
        }, [trimesterFilter]);

        const handleCopyUrl = async (project) => {
          try {
            await navigator.clipboard.writeText(project.url);
            setCopiedId(project.id);
            setTimeout(() => setCopiedId((curr) => (curr === project.id ? null : curr)), 1500);
          } catch {
            // Ignora caso área de transferência esteja bloqueada
          }
        };

        const resetFilters = () => {
          setTrimesterFilter('all');
          setCategoryFilter('all');
          setSearchQuery('');
        };

        return (
          <section id="projetos" className="py-12 sm:py-16 border-t border-slate-800/70">
            <div className="max-w-[1200px] mx-auto px-4 sm:px-6">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
                <div>
                  <p className="text-xs font-medium text-cyan-400 mb-1">
                    Catálogo Unificado · Todos os Trimestres
                  </p>
                  <h2 className="font-display text-2xl sm:text-3xl font-bold text-white tracking-tight">
                    Projetos Desenvolvidos
                  </h2>
                  <p className="text-sm sm:text-base text-slate-400 mt-1 max-w-2xl">
                    Todos os {PROJECTS.length} links reais de HTML, JavaScript e Google AI em um só lugar,
                    com execução interativa de código JS direto no navegador.
                  </p>
                </div>

                <p className="text-xs sm:text-sm text-slate-400 font-mono tabular-nums shrink-0">
                  Exibindo {filteredProjects.length} de {PROJECTS.length}
                </p>
              </div>

              {/* Controles: Busca + Filtros */}
              <div className="bg-[#0D1526] border border-slate-800 rounded-2xl p-4 sm:p-5 mb-8 space-y-4">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-center">
                  <div className="lg:col-span-5 relative">
                    <IconSearch className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
                    <input
                      type="search"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Buscar projeto, tecnologia ou URL..."
                      aria-label="Buscar projetos"
                      className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#070D1B] border border-slate-700/80 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-400 transition-colors"
                    />
                  </div>

                  <div className="lg:col-span-7 flex flex-wrap items-center gap-2">
                    <div
                      role="group"
                      aria-label="Filtrar por trimestre"
                      className="inline-flex flex-wrap items-center gap-1 p-1 rounded-xl bg-[#070D1B] border border-slate-800"
                    >
                      {['all', 1, 2, 3].map((tri) => {
                        const active = trimesterFilter === tri;
                        const label = tri === 'all' ? 'Todos' : `${tri}º Tri`;
                        return (
                          <button
                            key={String(tri)}
                            type="button"
                            onClick={() => setTrimesterFilter(tri)}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer whitespace-nowrap tabular-nums min-h-[36px] ${
                              active
                                ? 'bg-cyan-500 text-slate-950'
                                : 'text-slate-300 hover:text-white'
                            }`}
                          >
                            {label} ({trimesterCounts[tri]})
                          </button>
                        );
                      })}
                    </div>

                    <div
                      role="group"
                      aria-label="Filtrar por tecnologia"
                      className="inline-flex flex-wrap items-center gap-1 p-1 rounded-xl bg-[#070D1B] border border-slate-800"
                    >
                      {['all', 'HTML', 'JavaScript', 'Google AI'].map((cat) => {
                        const active = categoryFilter === cat;
                        const label = cat === 'all' ? 'Todas' : cat;
                        return (
                          <button
                            key={cat}
                            type="button"
                            onClick={() => setCategoryFilter(cat)}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer whitespace-nowrap tabular-nums min-h-[36px] ${
                              active
                                ? 'bg-slate-200 text-slate-950'
                                : 'text-slate-300 hover:text-white'
                            }`}
                          >
                            {label} ({categoryCounts[cat]})
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>

              {/* Grid de Resultados */}
              {filteredProjects.length === 0 ? (
                <div className="bg-[#0D1526] border border-slate-800 rounded-2xl p-10 text-center">
                  <p className="font-display text-lg font-bold text-white mb-2">
                    Nenhum projeto encontrado nesta combinação
                  </p>
                  <p className="text-sm text-slate-400 mb-5">
                    Tente alterar o trimestre, a tecnologia ou limpar o termo de busca.
                  </p>
                  <button
                    type="button"
                    onClick={resetFilters}
                    className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-sm font-semibold transition-colors cursor-pointer min-h-[40px]"
                  >
                    <IconRotateCcw className="w-4 h-4" />
                    <span>Limpar filtros</span>
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {filteredProjects.map((project) => {
                    const isJs =
                      project.kind === 'js-raw' || project.kind === 'github-repo';
                    const isCopied = copiedId === project.id;

                    return (
                      <article
                        key={project.id}
                        className="flex flex-col justify-between bg-[#0D1526] border border-slate-800/90 hover:border-cyan-500/50 rounded-2xl p-5 transition-all duration-200 hover:-translate-y-0.5"
                      >
                        <div>
                          <p className="text-xs text-slate-400 font-medium mb-2">
                            <span className="text-cyan-400">
                              {project.trimester}º Trimestre
                            </span>
                            <span className="mx-1.5 text-slate-600" aria-hidden="true">
                              ·
                            </span>
                            <span>{project.category}</span>
                            {project.authors === 'Miguel & Alifer' && (
                              <>
                                <span className="mx-1.5 text-slate-600" aria-hidden="true">
                                  ·
                                </span>
                                <span className="text-slate-300">Miguel &amp; Alifer</span>
                              </>
                            )}
                          </p>

                          <h3 className="font-display text-lg font-bold text-white tracking-tight mb-2">
                            {project.title}
                          </h3>

                          <p className="text-sm text-slate-300 leading-relaxed mb-4">
                            {project.description}
                          </p>
                        </div>

                        <div>
                          <p
                            title={project.url}
                            className="font-mono text-xs text-slate-500 truncate mb-4 pt-3 border-t border-slate-800/80"
                          >
                            {project.url.replace(/^https?:\/\//, '')}
                          </p>

                          <div className="flex items-center gap-2">
                            {isJs ? (
                              <button
                                type="button"
                                onClick={() => onOpenJsSandbox(project)}
                                className="flex-1 inline-flex items-center justify-center gap-2 px-3.5 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold text-xs sm:text-sm transition-colors cursor-pointer whitespace-nowrap min-h-[40px]"
                              >
                                <IconCode className="w-4 h-4 shrink-0" />
                                <span>Ver e Executar JS</span>
                              </button>
                            ) : (
                              <a
                                href={project.url}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="flex-1 inline-flex items-center justify-center gap-2 px-3.5 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold text-xs sm:text-sm transition-colors whitespace-nowrap min-h-[40px]"
                              >
                                <span>Abrir Projeto</span>
                                <IconExternalLink className="w-3.5 h-3.5 shrink-0" />
                              </a>
                            )}

                            {isJs && (
                              <a
                                href={project.url}
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label={`Abrir link original de ${project.title}`}
                                title="Abrir link original"
                                className="inline-flex items-center justify-center p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors min-h-[40px] min-w-[40px]"
                              >
                                <IconExternalLink className="w-4 h-4" />
                              </a>
                            )}

                            <button
                              type="button"
                              onClick={() => handleCopyUrl(project)}
                              aria-label={`Copiar URL de ${project.title}`}
                              title="Copiar link"
                              className="inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition-colors cursor-pointer whitespace-nowrap min-h-[40px]"
                            >
                              {isCopied ? (
                                <IconCheck className="w-3.5 h-3.5 text-emerald-400" />
                              ) : (
                                <IconCopy className="w-3.5 h-3.5" />
                              )}
                              <span>{isCopied ? 'Copiado!' : 'Copiar'}</span>
                            </button>
                          </div>
                        </div>
                      </article>
                    );
                  })}
                </div>
              )}
            </div>
          </section>
        );
      }

      function formatValue(val) {
        if (typeof val === 'string') return val;
        if (
          typeof val === 'number' ||
          typeof val === 'boolean' ||
          val === null ||
          val === undefined
        ) {
          return String(val);
        }
        try {
          return JSON.stringify(val, null, 2);
        } catch {
          return String(val);
        }
      }

      function JsSandboxModal({ project, onClose }) {
        const [files, setFiles] = useState({});
        const [originalFiles, setOriginalFiles] = useState({});
        const [activeFileName, setActiveFileName] = useState('');
        const [loading, setLoading] = useState(false);
        const [fetchNote, setFetchNote] = useState(null);
        const [consoleOutput, setConsoleOutput] = useState([]);
        const [copiedCode, setCopiedCode] = useState(false);

        const loadSources = useCallback(async (target) => {
          setLoading(true);
          setFetchNote(null);
          setConsoleOutput([]);

          try {
            if (target.rawFiles && target.rawFiles.length > 0) {
              const loaded = {};
              let usedFallback = false;

              await Promise.all(
                target.rawFiles.map(async (rf) => {
                  try {
                    const res = await fetch(rf.rawUrl);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    loaded[rf.name] = await res.text();
                  } catch {
                    if (rf.fallbackContent) {
                      loaded[rf.name] = rf.fallbackContent;
                      usedFallback = true;
                    } else {
                      loaded[rf.name] =
                        `// Não foi possível carregar ${rf.name} no momento.\n// URL original: ${rf.rawUrl}`;
                      usedFallback = true;
                    }
                  }
                }),
              );

              setFiles(loaded);
              setOriginalFiles(loaded);
              setActiveFileName(target.rawFiles[0].name);
              if (usedFallback) {
                setFetchNote(
                  'Alguns arquivos foram carregados da cópia local de segurança.',
                );
              }
            } else {
              const fileName = target.url.split('/').pop() || `${target.title}.js`;
              try {
                const res = await fetch(target.url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                setFiles({ [fileName]: text });
                setOriginalFiles({ [fileName]: text });
                setActiveFileName(fileName);
              } catch {
                const fallback =
                  target.fallbackCode ||
                  `// Código indisponível offline.\n// Acesse o arquivo original em: ${target.url}`;
                setFiles({ [fileName]: fallback });
                setOriginalFiles({ [fileName]: fallback });
                setActiveFileName(fileName);
                setFetchNote(
                  'Falha de rede ao buscar o arquivo remoto; exibindo modo de segurança.',
                );
              }
            }
          } finally {
            setLoading(false);
          }
        }, []);

        useEffect(() => {
          if (!project) return;
          loadSources(project);
        }, [project, loadSources]);

        useEffect(() => {
          if (!project) return;
          const onKeyDown = (e) => {
            if (e.key === 'Escape') onClose();
          };
          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);
        }, [project, onClose]);

        if (!project) return null;

        const activeCode = files[activeFileName] ?? '';
        const isJsonFile = activeFileName.endsWith('.json');

        const runCode = () => {
          const logs = [];

          if (isJsonFile) {
            try {
              const parsed = JSON.parse(activeCode);
              logs.push({
                level: 'info',
                text: 'JSON válido. Estrutura interpretada com sucesso:',
              });
              logs.push({
                level: 'log',
                text: JSON.stringify(parsed, null, 2),
              });
            } catch (err) {
              logs.push({
                level: 'error',
                text: `Erro ao validar JSON: ${err instanceof Error ? err.message : String(err)}`,
              });
            }
            setConsoleOutput(logs);
            return;
          }

          const pushLog = (level, args) => {
            logs.push({
              level,
              text: args.map(formatValue).join(' '),
            });
          };

          const virtualConsole = {
            log: (...args) => pushLog('log', args),
            info: (...args) => pushLog('info', args),
            warn: (...args) => pushLog('warn', args),
            error: (...args) => pushLog('error', args),
            table: (data) => pushLog('log', [data]),
            time: () => {},
            timeLog: (...args) => pushLog('info', args),
            timeEnd: (...args) => pushLog('info', args),
          };

          const virtualRequire = (modulePath) => {
            const normalized = modulePath.replace(/^\.\//, '').toLowerCase();
            if (normalized.includes('cliente.json') && files['cliente.json']) {
              return JSON.parse(files['cliente.json']);
            }
            const matchedKey = Object.keys(files).find(
              (key) => key.toLowerCase() === normalized,
            );
            if (matchedKey && matchedKey.endsWith('.json')) {
              return JSON.parse(files[matchedKey]);
            }
            throw new Error(`Módulo não disponível no sandbox: ${modulePath}`);
          };

          try {
            const runner = new Function('console', 'require', `"use strict";\n${activeCode}`);
            runner(virtualConsole, virtualRequire);
            if (logs.length === 0) {
              logs.push({
                level: 'info',
                text: 'Script executado sem erros (nenhuma saída em console.log).',
              });
            }
          } catch (err) {
            logs.push({
              level: 'error',
              text: err instanceof Error ? `${err.name}: ${err.message}` : String(err),
            });
          }

          setConsoleOutput(logs);
        };

        const handleCopyCode = async () => {
          try {
            await navigator.clipboard.writeText(activeCode);
            setCopiedCode(true);
            setTimeout(() => setCopiedCode(false), 1500);
          } catch {
            // Ignora
          }
        };

        const handleReset = () => {
          setFiles(originalFiles);
          setConsoleOutput([]);
        };

        return (
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby="sandbox-modal-title"
            className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/80 backdrop-blur-sm"
            onClick={onClose}
          >
            <div
              className="w-full max-w-5xl max-h-[92vh] flex flex-col bg-[#0B1221] border border-slate-700/90 rounded-2xl overflow-hidden shadow-2xl"
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-start justify-between gap-4 px-5 py-4 border-b border-slate-800 bg-[#080E1A]">
                <div className="min-w-0">
                  <p className="text-xs font-medium text-cyan-400">
                    {project.trimester}º Trimestre · {project.category} · {project.authors}
                  </p>
                  <h3
                    id="sandbox-modal-title"
                    className="font-display text-xl font-bold text-white truncate mt-0.5"
                  >
                    {project.title}
                  </h3>
                  <p className="text-xs sm:text-sm text-slate-400 mt-1">
                    {project.description}
                  </p>
                </div>
                <button
                  type="button"
                  onClick={onClose}
                  aria-label="Fechar visualizador de código"
                  className="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer shrink-0 min-h-[40px] min-w-[40px] flex items-center justify-center"
                >
                  <IconX className="w-5 h-5" />
                </button>
              </div>

              <div className="flex flex-wrap items-center justify-between gap-3 px-5 py-3 border-b border-slate-800 bg-[#0D1526]">
                <div className="flex flex-wrap items-center gap-1.5">
                  {Object.keys(files).map((fileName) => (
                    <button
                      key={fileName}
                      type="button"
                      onClick={() => {
                        setActiveFileName(fileName);
                        setConsoleOutput([]);
                      }}
                      className={`px-3 py-1.5 rounded-md text-xs font-mono font-medium transition-colors cursor-pointer whitespace-nowrap ${
                        activeFileName === fileName
                          ? 'bg-cyan-500 text-slate-950'
                          : 'bg-slate-800/80 text-slate-300 hover:text-white hover:bg-slate-700'
                      }`}
                    >
                      {fileName}
                    </button>
                  ))}
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <button
                    type="button"
                    onClick={runCode}
                    disabled={loading}
                    className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-semibold text-xs transition-colors cursor-pointer whitespace-nowrap min-h-[36px]"
                  >
                    <IconPlay className="w-3.5 h-3.5" />
                    <span>{isJsonFile ? 'Validar JSON' : 'Executar Script'}</span>
                  </button>
                  <button
                    type="button"
                    onClick={handleReset}
                    className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-xs transition-colors cursor-pointer whitespace-nowrap min-h-[36px]"
                  >
                    <IconRotateCcw className="w-3.5 h-3.5" />
                    <span>Restaurar</span>
                  </button>
                  <button
                    type="button"
                    onClick={handleCopyCode}
                    className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-xs transition-colors cursor-pointer whitespace-nowrap min-h-[36px]"
                  >
                    {copiedCode ? (
                      <IconCheck className="w-3.5 h-3.5 text-emerald-400" />
                    ) : (
                      <IconCopy className="w-3.5 h-3.5" />
                    )}
                    <span>{copiedCode ? 'Copiado!' : 'Copiar'}</span>
                  </button>
                  <a
                    href={project.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-300 font-medium text-xs transition-colors whitespace-nowrap min-h-[36px]"
                  >
                    <span>Link Original</span>
                    <IconExternalLink className="w-3.5 h-3.5" />
                  </a>
                </div>
              </div>

              {fetchNote && (
                <div className="px-5 py-2 bg-amber-950/50 border-b border-amber-800/50 text-amber-200 text-xs">
                  {fetchNote}
                </div>
              )}

              <div className="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-slate-800 overflow-y-auto">
                <div className="flex flex-col min-h-[260px]">
                  <div className="px-4 py-2 text-xs font-medium text-slate-400 bg-[#080E1A] border-b border-slate-800 flex items-center justify-between">
                    <span>Código-fonte editável</span>
                    <span className="font-mono tabular-nums">
                      {activeCode.split('\n').length} linhas
                    </span>
                  </div>
                  {loading ? (
                    <div className="flex-1 flex items-center justify-center p-8 text-sm text-slate-400">
                      Carregando arquivo original...
                    </div>
                  ) : (
                    <textarea
                      aria-label="Editor de código JavaScript"
                      value={activeCode}
                      onChange={(e) =>
                        setFiles((prev) => ({ ...prev, [activeFileName]: e.target.value }))
                      }
                      spellCheck={false}
                      className="flex-1 w-full min-h-[240px] lg:min-h-[340px] p-4 bg-[#060A14] text-slate-100 font-mono text-xs sm:text-sm leading-relaxed resize-none focus:outline-none"
                    />
                  )}
                </div>

                <div className="flex flex-col min-h-[220px] bg-[#070B14]">
                  <div className="px-4 py-2 text-xs font-medium text-slate-400 bg-[#080E1A] border-b border-slate-800 flex items-center gap-2">
                    <IconTerminal className="w-3.5 h-3.5 text-emerald-400" />
                    <span>Saída do Console</span>
                  </div>
                  <div className="flex-1 p-4 overflow-y-auto font-mono text-xs sm:text-sm space-y-2">
                    {consoleOutput.length === 0 ? (
                      <p className="text-slate-500">
                        Clique em &ldquo;{isJsonFile ? 'Validar JSON' : 'Executar Script'}&rdquo; acima para rodar o código e ver o resultado aqui.
                      </p>
                    ) : (
                      consoleOutput.map((entry, idx) => (
                        <pre
                          key={idx}
                          className={`whitespace-pre-wrap break-words rounded-lg px-3 py-2 border ${
                            entry.level === 'error'
                              ? 'bg-red-950/40 border-red-800/60 text-red-300'
                              : entry.level === 'warn'
                              ? 'bg-amber-950/40 border-amber-800/60 text-amber-200'
                              : entry.level === 'info'
                              ? 'bg-cyan-950/30 border-cyan-900/50 text-cyan-200'
                              : 'bg-slate-900/80 border-slate-800 text-emerald-300'
                          }`}
                        >
                          {entry.text}
                        </pre>
                      ))
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function App() {
        const [sandboxProject, setSandboxProject] = useState(null);

        const handleNavigateSection = (sectionId) => {
          document.getElementById(sectionId)?.scrollIntoView({ behavior: 'smooth' });
        };

        return (
          <div className="min-h-screen flex flex-col bg-[#060B16] text-slate-100">
            <Navbar onNavigateSection={handleNavigateSection} />

            <main className="flex-1">
              {/* 1. Tudo do Colégio Unidade Polo primeiro */}
              <HeroSchoolSection onNavigateSection={handleNavigateSection} />
              <CoursesAndCampusSection />

              {/* 2. Depois do colégio: Informação do Miguel + Todos os 34 Links */}
              <AuthorProfileSection
                onExploreProjects={() => handleNavigateSection('projetos')}
              />
              <ProjectsSection
                onOpenJsSandbox={(project) => setSandboxProject(project)}
              />
            </main>

            <footer className="border-t border-slate-800/80 bg-[#050912]">
              <div className="max-w-[1200px] mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs sm:text-sm text-slate-400">
                <p>
                  {SCHOOL_INFO.name} — {SCHOOL_INFO.city} · © {SCHOOL_INFO.year}
                </p>
                <div className="flex items-center gap-4">
                  <a
                    href={PROFILE_INFO.githubUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="hover:text-white transition-colors"
                  >
                    GitHub
                  </a>
                  <span className="text-slate-700" aria-hidden="true">
                    ·
                  </span>
                  <a
                    href={PROFILE_INFO.linkedinUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="hover:text-white transition-colors"
                  >
                    LinkedIn
                  </a>
                </div>
              </div>
            </footer>

            <JsSandboxModal
              project={sandboxProject}
              onClose={() => setSandboxProject(null)}
            />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
